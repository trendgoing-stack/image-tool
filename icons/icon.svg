<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- アイコンのデザイン元。PNG は scripts/generate-icons.mjs で同じ図形を描いて生成する -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="20" y="26" width="60" height="48" rx="6"/>
    </clipPath>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect x="20" y="26" width="60" height="48" rx="6" fill="#fff"/>
  <g clip-path="url(#card)">
    <polygon points="40,42 62.4,74 17.6,74" fill="#64aaff"/>
    <polygon points="60,50 79.7,74 40.3,74" fill="#0a6ee6"/>
  </g>
  <circle cx="64" cy="40" r="5.5" fill="#ffcc00"/>
</svg>
